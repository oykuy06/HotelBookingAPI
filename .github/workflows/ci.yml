
name: CI + Local CD Simulation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore ./HotelBookingAPI.sln

      - name: Build
        run: dotnet build ./HotelBookingAPI.sln --no-restore

      - name: Run tests
        run: dotnet test ./HotelBookingAPITests/HotelBookingAPITests.csproj --no-build --no-restore --verbosity normal

  deploy-local:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Project
        run: dotnet publish ./HotelBookingAPI/HotelBookingAPI.csproj -c Release -o ./publish
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
